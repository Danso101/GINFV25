<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitch Booking Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
  <div class="container py-5">
    <header class="mb-4 text-center">
      <h1 class="display-5 fw-bold text-primary">🏟️ Pitch Booking Hub</h1>
      <p class="lead">Reserve athletic pitches quickly and verify dynamic pricing instantly.</p>
    </header>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h5 class="card-title mb-3 fw-bold">New Pitch Booking</h5>
            
            <div id="feedback" class="alert d-none" role="alert"></div>

            <form id="bookingForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Select Active User</label>
                <select id="userSelect" class="form-select" required></select>
              </div>
              <div class="mb-3">
                <label class="form-label">Select Pitch Arena</label>
                <select id="pitchSelect" class="form-select" required></select>
              </div>
              <div class="mb-3">
                <label class="form-label">Booking Date</label>
                <input type="date" id="bookingDate" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Start Time</label>
                <input type="time" id="bookingTime" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Duration (Hours)</label>
                <input type="number" id="bookingHours" class="form-control" min="1" max="10" placeholder="e.g. 2" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 fw-bold">Reserve Spot</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h5 class="card-title mb-3 fw-bold">Live Reservations Tracking</h5>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-dark">
                  <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Pitch</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Duration</th>
                    <th>Price</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="bookingsTableBody">
                  </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
